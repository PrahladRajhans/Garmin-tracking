[project]
name = "garmin-mcp"
version = "0.33.1"
description = "Free, self-hosted MCP server that exposes your Garmin Connect data to AI assistants."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Prahlad Rajhans"}]
dependencies = [
    "mcp>=2.0,<3",
    "garminconnect>=0.3.20,<0.4",
    "python-dotenv>=1.0",
    "garmin-fit-sdk>=21.0",
    "garmin-connect-personal-api-python>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"
garmin-mcp-sync = "garmin_mcp.sync:main"
garmin-mcp-import = "garmin_mcp.importer:main"
garmin-mcp-verify = "garmin_mcp.verify:main"
garmin-mcp-conditions = "garmin_mcp.conditions:main"
garmin-mcp-dashboard = "garmin_mcp.dashboard:main"
garmin-mcp-weather = "garmin_mcp.weather_fetch:main"
garmin-mcp-narrator = "garmin_mcp.narrator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
